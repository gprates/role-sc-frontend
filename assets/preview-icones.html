<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ícones Rolê SC</title>
<style>
  :root { --bg:#F0F9FF; --surface:#fff; --text:#001E3C; --muted:#64748B; --border:#DBEAFE; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1220; --surface:#131c2e; --text:#e8eefc; --muted:#93a4c0; --border:#1e2b45; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px; background:var(--bg); color:var(--text);
         font:16px/1.5 "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 28px; color:var(--muted); }
  .row { display:flex; gap:20px; align-items:flex-end; flex-wrap:wrap;
         background:var(--surface); border:1px solid var(--border);
         border-radius:16px; padding:20px; margin-bottom:18px; }
  .meta { min-width:190px; }
  .meta h2 { font-size:17px; margin:0 0 4px; }
  .meta span { color:var(--muted); font-size:13.5px; }
  figure { margin:0; text-align:center; }
  figcaption { color:var(--muted); font-size:12px; margin-top:6px; }
  .ico { display:block; border-radius:22.5%; overflow:hidden; }
  .circ { border-radius:50%; }
  svg { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<h1>Ícones — Rolê SC</h1>
<p class="sub">O tamanho que decide é o de 48&nbsp;px: é assim que ele aparece na gaveta de apps. O círculo mostra o recorte que muitos launchers Android aplicam.</p>

<div id="app"></div>

<script>
const G = `<defs><linearGradient id="G_ID" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0A65C1"/><stop offset="1" stop-color="#5EB3F2"/></linearGradient></defs>`;

const PIN = `<path d="M512,832 C512,832 292,572 292,430 A220,220 0 1 1 732,430 C732,572 512,832 512,832 Z" fill="#FFFFFF"/>`;

const conceitos = [
  { id:'a', nome:'A — Pin + onda', desc:'Direto ao ponto: lugar + litoral.',
    body: G + `<rect width="1024" height="1024" fill="url(#G_ID)"/>` + PIN +
      `<circle cx="512" cy="424" r="134" fill="url(#G_ID)"/>
       <path d="M418,424 q23.5,-30 47,0 t47,0 t47,0 t47,0" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>` },
  { id:'b', nome:'B — Sol sobre ondas', desc:'O mais legível pequeno. Menos "evento".',
    body: G + `<rect width="1024" height="1024" fill="url(#G_ID)"/>
       <circle cx="512" cy="396" r="158" fill="#fff"/>
       <g fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round">
         <path d="M236,644 q69,-56 138,0 t138,0 t138,0 t138,0"/>
         <path d="M236,760 q69,-56 138,0 t138,0 t138,0 t138,0"/>
         <path d="M236,876 q69,-56 138,0 t138,0 t138,0 t138,0"/>
       </g>` },
  { id:'c', nome:'C — Pin com sol e mar', desc:'Mais rico. Confira se aguenta 48 px.',
    body: G + `<clipPath id="C_ID"><circle cx="512" cy="424" r="140"/></clipPath>
       <rect width="1024" height="1024" fill="url(#G_ID)"/>` + PIN +
      `<g clip-path="url(#C_ID)">
         <circle cx="512" cy="424" r="140" fill="url(#G_ID)"/>
         <circle cx="512" cy="408" r="66" fill="#fff"/>
         <g fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round">
           <path d="M372,470 q35,-28 70,0 t70,0 t70,0 t70,0"/>
           <path d="M372,536 q35,-28 70,0 t70,0 t70,0 t70,0"/>
         </g>
       </g>` },
];

const tamanhos = [160, 96, 72, 48];

document.getElementById('app').innerHTML = conceitos.map(c => {
  // ids únicos por conceito e por tamanho, senão os <defs> colidem entre SVGs.
  const figs = tamanhos.map(s => {
    const uid = `${c.id}${s}`;
    const svg = `<svg viewBox="0 0 1024 1024">${c.body.replace(/G_ID/g, 'g'+uid).replace(/C_ID/g, 'c'+uid)}</svg>`;
    return `<figure><div class="ico" style="width:${s}px;height:${s}px">${svg}</div>
            <figcaption>${s} px</figcaption></figure>`;
  }).join('');
  const uidc = `${c.id}circ`;
  const circ = `<figure><div class="ico circ" style="width:72px;height:72px">
      <svg viewBox="0 0 1024 1024">${c.body.replace(/G_ID/g,'g'+uidc).replace(/C_ID/g,'c'+uidc)}</svg>
    </div><figcaption>recorte</figcaption></figure>`;
  return `<div class="row"><div class="meta"><h2>${c.nome}</h2><span>${c.desc}</span></div>${figs}${circ}</div>`;
}).join('');
</script>
</body>
</html>
